name: dbt CI

on:
  pull_request:
    paths:
      - "03_transform/dbt/**"
      - ".github/workflows/dbt-ci.yml"
    branches:
      - main
      - integration
  push:
    branches:
      - integration
    paths:
      - "03_transform/dbt/**"

env:
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
  GCP_DBT_SA_EMAIL: ${{ vars.GCP_DBT_SA_EMAIL }}

jobs:
  dbt-run:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Authentifier via Workload Identity Federation
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_DBT_SA_EMAIL }}

      - name: Configurer Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Installer uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Installer les dépendances
        working-directory: 03_transform
        run: uv sync

      - name: Créer les datasets BigQuery éphémères
        run: |
          PR_NUM="${{ github.event.pull_request.number }}"
          DATASET_BASE="ci_pr_${PR_NUM}"
          echo "DBT_CI_DATASET=${DATASET_BASE}" >> "$GITHUB_ENV"
          bq mk --dataset --location=europe-west1 "${GCP_PROJECT_ID}:${DATASET_BASE}"
          bq mk --dataset --location=europe-west1 "${GCP_PROJECT_ID}:${DATASET_BASE}_intermediate_dev"

      - name: dbt run
        working-directory: 03_transform
        run: >
          DBT_TARGET_ENV=ci
          uv run dbt run
          --project-dir dbt
          --profiles-dir dbt
          --no-partial-parse

      - name: dbt test
        working-directory: 03_transform
        run: >
          DBT_TARGET_ENV=ci
          uv run dbt test
          --project-dir dbt
          --profiles-dir dbt

      - name: Nettoyer les datasets éphémères
        if: always()
        run: |
          PR_NUM="${{ github.event.pull_request.number }}"
          DATASET_BASE="ci_pr_${PR_NUM}"
          bq rm -r -f --dataset "${GCP_PROJECT_ID}:${DATASET_BASE}"
          bq rm -r -f --dataset "${GCP_PROJECT_ID}:${DATASET_BASE}_intermediate_dev"
