name: CI - Tests & Securite

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches:
      - main
      - integration
    paths-ignore:
      - "_*/**"
      - "**/_*/**"
  push:
    branches:
      - integration
    paths-ignore:
      - "_*/**"
      - "**/_*/**"

env:
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
  GCP_DBT_SA_EMAIL: ${{ vars.GCP_DBT_SA_EMAIL }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      dbt: ${{ steps.filter.outputs.dbt }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detecter les changements dbt
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            dbt:
              - "03_transform/dbt/**"
              - ".github/workflows/ci.yml"

  lint-and-test:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan des secrets (TruffleHog)
        if: github.event_name == 'pull_request'
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD

      - name: Installer uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Installer les dependances
        run: uv sync --all-extras --dev

      - name: Linter le code Python (Ruff)
        run: uv run ruff check .

      - name: Verifier le formatage
        run: uv run ruff format --check .

      - name: Executer les tests
        run: uv run pytest tests/

      - name: Dbt - Verification du graphe et de la syntaxe
        working-directory: 03_transform
        run: |
          uv run dbt parse --project-dir dbt --profiles-dir dbt --target local

      - name: Dbt - Linter SQL (SQLFluff)
        run: |
          uv run sqlfluff lint 03_transform/dbt/models --dialect bigquery

  dbt-run:
    needs: changes
    if: needs.changes.outputs.dbt == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Authentifier via Workload Identity Federation
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_DBT_SA_EMAIL }}

      - name: Configurer Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Installer uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Installer les dependances
        working-directory: 03_transform
        run: uv sync

      - name: Creer les datasets BigQuery ephemeres
        run: |
          PR_NUM="${{ github.event.pull_request.number }}"
          DATASET_BASE="ci_pr_${PR_NUM}"
          echo "DBT_CI_DATASET=${DATASET_BASE}" >> "$GITHUB_ENV"
          bq mk --dataset --location=europe-west1 "${GCP_PROJECT_ID}:${DATASET_BASE}"
          bq mk --dataset --location=europe-west1 "${GCP_PROJECT_ID}:${DATASET_BASE}_intermediate_dev"

      - name: dbt run
        working-directory: 03_transform
        run: >
          DBT_TARGET_ENV=ci
          uv run dbt run
          --project-dir dbt
          --profiles-dir dbt
          --no-partial-parse

      - name: dbt test
        working-directory: 03_transform
        run: >
          DBT_TARGET_ENV=ci
          uv run dbt test
          --project-dir dbt
          --profiles-dir dbt

      - name: Nettoyer les datasets ephemeres
        if: always()
        run: |
          PR_NUM="${{ github.event.pull_request.number }}"
          DATASET_BASE="ci_pr_${PR_NUM}"
          bq rm -r -f --dataset "${GCP_PROJECT_ID}:${DATASET_BASE}"
          bq rm -r -f --dataset "${GCP_PROJECT_ID}:${DATASET_BASE}_intermediate_dev"
