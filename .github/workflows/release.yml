name: CD - Semantic Release & Docker

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
      - integration
    paths-ignore:
      - "_*/**"
      - "**/_*/**"

env:
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
  GCP_DBT_SA_EMAIL: ${{ vars.GCP_DBT_SA_EMAIL }}
  REGISTRY: europe-west1-docker.pkg.dev
  REPOSITORY: data-market-docker-repository

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            shared:
              - '01_shared/**'
              - 'pyproject.toml'
              - 'uv.lock'
            ft:
              - '02_extract/france_travail/**'
            geo:
              - '02_extract/geo/**'
            adzuna:
              - '02_extract/adzuna/**'
            dbt:
              - '03_transform/**'

      - name: Python Semantic Release
        id: semantic
        uses: python-semantic-release/python-semantic-release@v9
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Authentifier via Workload Identity Federation
        if: steps.semantic.outputs.released == 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_DBT_SA_EMAIL }}

      - name: Configurer Docker Buildx
        if: steps.semantic.outputs.released == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Authentifier Docker a Artifact Registry
        if: steps.semantic.outputs.released == 'true'
        run: gcloud auth configure-docker $REGISTRY

      - name: Build & Push extract-ft
        if: steps.semantic.outputs.released == 'true' && (steps.filter.outputs.shared == 'true' || steps.filter.outputs.ft == 'true')
        uses: docker/build-push-action@v6
        with:
          context: .
          file: 02_extract/france_travail/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/extract-ft:${{ steps.semantic.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/extract-ft:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push extract-geo
        if: steps.semantic.outputs.released == 'true' && (steps.filter.outputs.shared == 'true' || steps.filter.outputs.geo == 'true')
        uses: docker/build-push-action@v6
        with:
          context: .
          file: 02_extract/geo/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/extract-geo:${{ steps.semantic.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/extract-geo:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push extract-adzuna
        if: steps.semantic.outputs.released == 'true' && (steps.filter.outputs.shared == 'true' || steps.filter.outputs.adzuna == 'true')
        uses: docker/build-push-action@v6
        with:
          context: .
          file: 02_extract/adzuna/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/extract-adzuna:${{ steps.semantic.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/extract-adzuna:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push dbt-transform
        if: steps.semantic.outputs.released == 'true' && (steps.filter.outputs.shared == 'true' || steps.filter.outputs.dbt == 'true')
        uses: docker/build-push-action@v6
        with:
          context: .
          file: 03_transform/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/dbt-transform:${{ steps.semantic.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/dbt-transform:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max