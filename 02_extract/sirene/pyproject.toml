[project]
name = "sirene"
version = "0.1.0"
description = "Stub de l'extracteur Sirene"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "python-dotenv>=1.0.1",
    "shared",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.uv.sources]
shared = { workspace = true }

[tool.setuptools]
py-modules = ["main"]
