[project]
name = "n8n-trigger"
version = "0.1.0"
description = "BigQuery → n8n → GCS pipeline for societe.com scraping"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.33.1",
    "google-cloud-bigquery>=3.15.0",
    "shared",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.uv.sources]
shared = { workspace = true }

[tool.setuptools]
py-modules = ["main"]
