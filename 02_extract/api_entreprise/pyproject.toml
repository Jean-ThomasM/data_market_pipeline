[project]
name = "api-entreprise"
version = "0.1.0"
description = "Recherche-entreprises.api.gouv.fr enrichment for adzuna offers"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "requests>=2.33.1",
    "google-cloud-bigquery>=3.15.0",
    "shared",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.uv.sources]
shared = { workspace = true }

[tool.setuptools]
py-modules = ["api", "main"]
