version: 2

sources:
  - name: france-travail
    description: "Tables raw issues de l'extraction France Travail."
    database: "{{ target.project if target.type == 'bigquery' else target.database }}"
    schema: "{{ target.schema }}"
    tables:
      - name: staging_offres_ft
        
  - name: geo-api
    description: "Tables raw issues de l'API geo (communes, departements, regions, epcis)."
    database: "{{ target.project if target.type == 'bigquery' else target.database }}"
    schema: "{{ target.schema }}"
    tables:
      - name: staging_communes
      - name: staging_departements
      - name: staging_regions
      - name: staging_epcis

  - name: adzuna
    description: "Tables raw issues de l'extraction Adzuna."
    database: "{{ target.project if target.type == 'bigquery' else target.database }}"
    schema: "{{ target.schema }}"
    tables:
      - name: staging_offres_adzuna

  - name: sirene
    description: "Tables raw issues de l'extraction Sirene (stock INSEE)."
    database: "{{ 'data-market-386959' if target.type == 'bigquery' else 'staging_offres_ft' }}"
    schema: "{{ 'staging_dev' if target.type == 'bigquery' else 'main' }}"
    tables:
      - name: staging_sirene

  - name: api_entreprise
    description: "Tables d'enrichissement issues de l'API Recherche Entreprises."
    database: "{{ target.project if target.type == 'bigquery' else target.database }}"
    schema: "{{ target.schema }}"
    tables:
      - name: staging_api_entreprise

  - name: n8n_societe
    description: "Tables d'enrichissement issues du scraping societe.com (via n8n)."
    database: "{{ target.project if target.type == 'bigquery' else target.database }}"
    schema: "{{ target.schema }}"
    tables:
      - name: staging_n8n_societe
