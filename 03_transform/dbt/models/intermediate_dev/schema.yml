version: 2

models:
  - name: int_geo_communes
    description: >
      Référentiel communal enrichi (communes, départements, régions, EPCI).
      Une ligne par couple (commune, code_postal).
    columns:
      - name: commune_code
        description: "Code INSEE de la commune."
        tests:
          - not_null
      - name: code_postal
        description: "Code postal de la commune."
      - name: departement_code
        description: "Code département (ex: 75)."
      - name: region_nom
        description: "Nom de la région."

  - name: int_ft_offres
    description: "Table consolidée des offres France Travail enrichie géographiquement."
    columns:
      - name: offer_id
        description: "ID unique de l'offre France Travail."
        tests:
          - not_null
          - unique
      - name: nom_commune
        description: "Nom de la commune matché avec le référentiel GEO."
        tests:
          - not_null
      - name: numero_departement
        description: "Code du département associé."
        tests:
          - not_null
      - name: has_salary_info
        description: "Flag indiquant si l'offre a des informations de salaire (0 ou 1)."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['0', '1']
      - name: is_alternance
        description: "Indique si l'offre est un contrat d'alternance (0 ou 1)."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['0', '1']

  - name: int_ft_employer_names
    description: >
      Enrichissement des noms d'employeurs des offres France Travail via
      lookup STRPOS (noms vérifiés FT + Adzuna) puis regex de fallback
      (Rejoindre X, X est un/une, Groupe X, etc.).
      Une ligne par offre; `enrichment_source` indique la provenance
      (raw/lookup/regex/fallback).
    columns:
      - name: offer_id
        description: "ID unique de l'offre France Travail."
        tests:
          - not_null
          - unique
      - name: employer_name_raw
        description: "Nom employeur brut depuis entreprise.nom (NULL si absent)."
      - name: employer_description
        description: "Description de l'entreprise depuis entreprise.description."
      - name: employer_name_enriched
        description: >
          Nom employeur enrichi : priorité raw, puis lookup STRPOS,
          puis regex fallback, NULL si introuvable.
      - name: enrichment_source
        description: "Source du nom enrichi : raw, lookup, regex, fallback."

  - name: int_adzuna_offres
    description: "Table consolidée des offres Adzuna enrichie géographiquement."
    columns:
      - name: offer_id
        description: "ID unique de l'offre (Adzuna ID)."
        tests:
          - not_null
          - unique
      - name: nom_commune
        description: "Nom de la commune matché avec le référentiel GEO."
        tests:
          - not_null
      - name: numero_departement
        description: "Code du département associé."
        tests:
          - not_null
      - name: has_salary_info
        description: "Flag indiquant si l'offre a des informations de salaire (0 ou 1)."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['0', '1']
      - name: is_alternance
        description: "Indique si l'offre est un contrat d'alternance (0 ou 1)."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['0', '1']

  - name: int_adzuna_enrichissement
    description: >
      Enrichissement corporate des offres Adzuna via API Entreprise (SIREN, finances, etc.)
      et scraping societe.com (capital social, convention collective, etc.).
    columns:
      - name: offer_id
        description: "ID unique de l'offre Adzuna."
        tests:
          - not_null
          - unique
      - name: employer_name
        description: "Nom de l'employeur."
        tests:
          - not_null
      - name: siren
        description: "SIREN de l'employeur (si trouvé)."
      - name: siret_siege
        description: "SIRET du siège social."
      - name: nom_raison_sociale
        description: "Raison sociale officielle de l'entreprise."
      - name: nature_juridique
        description: "Forme juridique (SAS, SARL, SA, etc.)."
      - name: categorie_entreprise
        description: "Catégorie (PME, ETI, GE)."
      - name: etat_administratif
        description: "État administratif (A=Actif, C=Fermé)."
      - name: egapro_renseignee
        description: "Index égalité professionnelle F/H renseigné."
      - name: est_ess
        description: "Entreprise de l'Économie Sociale et Solidaire."
      - name: ca_dernier_exercice
        description: "Chiffre d'affaires du dernier exercice connu (k€)."
      - name: resultat_net_dernier
        description: "Résultat net du dernier exercice connu (k€)."
      - name: capital_social
        description: "Capital social (depuis societe.com)."
      - name: convention_collective
        description: "Convention collective (IDCC)."

