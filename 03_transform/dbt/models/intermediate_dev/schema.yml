version: 2

models:
  - name: int_geo_communes
    description: >
      Référentiel communal enrichi (communes, départements, régions, EPCI).
      Une ligne par couple (commune, code_postal).
    columns:
      - name: commune_code
        description: "Code INSEE de la commune."
        tests:
          - not_null
      - name: code_postal
        description: "Code postal de la commune."
      - name: departement_code
        description: "Code département (ex: 75)."
      - name: region_nom
        description: "Nom de la région."

  - name: int_ft_offres
    description: "Table consolidée des offres France Travail enrichie géographiquement."
    columns:
      - name: offer_id
        description: "ID unique de l'offre France Travail."
        tests:
          - not_null
          - unique
      - name: nom_commune
        description: "Nom de la commune matché avec le référentiel GEO."
        tests:
          - not_null
      - name: numero_departement
        description: "Code du département associé."
        tests:
          - not_null
      - name: has_salary_info
        description: "Flag indiquant si l'offre a des informations de salaire (0 ou 1)."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['0', '1']
      - name: is_alternance
        description: "Indique si l'offre est un contrat d'alternance (0 ou 1)."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['0', '1']

  - name: int_adzuna_offres
    description: "Table consolidée des offres Adzuna enrichie géographiquement."
    columns:
      - name: offer_id
        description: "ID unique de l'offre (Adzuna ID)."
        tests:
          - not_null
          - unique
      - name: nom_commune
        description: "Nom de la commune matché avec le référentiel GEO."
        tests:
          - not_null
      - name: numero_departement
        description: "Code du département associé."
        tests:
          - not_null
      - name: has_salary_info
        description: "Flag indiquant si l'offre a des informations de salaire (0 ou 1)."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['0', '1']
      - name: is_alternance
        description: "Indique si l'offre est un contrat d'alternance (0 ou 1)."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['0', '1']

