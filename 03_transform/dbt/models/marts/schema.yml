version: 2

models:
  - name: mart_recruteurs
    description: "Agrégations par entreprise (recruteur) calculant le volume d'offres et les moyennes de salaires minimum et maximum."
    columns:
      - name: employer_name
        description: "Nom de l'entreprise ou employeur."
      - name: total_offres
        description: "Nombre total d'offres d'emploi."
      - name: total_offres_avec_salaire
        description: "Nombre d'offres d'emploi contenant des informations de salaire."
      - name: salaire_min_moyen
        description: "Moyenne des salaires minimums proposés par l'entreprise."
      - name: salaire_max_moyen
        description: "Moyenne des salaires maximums proposés par l'entreprise."

  - name: mart_offres_data_jobs
    description: "Table de faits centrale consolidant et filtrant toutes les offres d'emploi pour les profils Data Engineers (France Travail & Adzuna), enrichie des données corporate (SIREN, finances, etc.)."
    columns:
      - name: offer_id
        description: "Identifiant unique de l'offre."
        tests:
          - not_null
          - unique
      - name: source_system
        description: "Plateforme d'origine de l'offre (France Travail, Adzuna)."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['France Travail', 'Adzuna']
      - name: job_title
        description: "Intitulé du poste."
        tests:
          - not_null
      - name: contract_type
        description: "Type de contrat (ex: CDI, CDD, Alternance)."
      - name: nom_region
        description: "Région associée à la localisation de l'offre."
      - name: is_alternance
        description: "Flag indiquant si l'offre concerne de l'alternance (0 ou 1)."
        tests:
          - not_null
      - name: siren
        description: "SIREN de l'employeur (Adzuna uniquement)."
      - name: nom_raison_sociale
        description: "Raison sociale officielle."
      - name: categorie_entreprise
        description: "Catégorie d'entreprise (PME, ETI, GE)."
      - name: nature_juridique
        description: "Forme juridique (SAS, SARL, SA, etc.)."
      - name: egapro_renseignee
        description: "Index égalité professionnelle F/H renseigné."

  - name: mart_recrutement_geographique
    description: "Agrégations géographiques pour cartographier le recrutement en France (Région, Département, Commune)."
    columns:
      - name: nom_region
        description: "Nom de la région."
      - name: nom_departement
        description: "Nom du département."
      - name: nom_commune
        description: "Nom de la commune."
      - name: total_offres
        description: "Nombre total d'offres de Data Engineer publiées dans cette commune."
      - name: total_employeurs_distincts
        description: "Nombre d'employeurs différents recrutant dans cette commune."

  - name: mart_employeurs_corporate
    description: "Fiches corporate des employeurs Adzuna enrichies (SIREN, finances, RSE, structure)."
    columns:
      - name: employer_name
        description: "Nom de l'employeur."
        tests:
          - not_null
      - name: siren
        description: "SIREN de l'entreprise."
      - name: siret_siege
        description: "SIRET du siège social."
      - name: nom_raison_sociale
        description: "Raison sociale officielle."
      - name: nature_juridique
        description: "Forme juridique."
      - name: categorie_entreprise
        description: "Catégorie (PME, ETI, GE)."
      - name: tranche_effectif_salarie
        description: "Tranche d'effectif salarié."
      - name: etat_administratif
        description: "État administratif (A=Actif, C=Fermé)."
      - name: egapro_renseignee
        description: "Index égalité professionnelle F/H renseigné."
      - name: est_ess
        description: "Entreprise de l'ESS."
      - name: est_association
        description: "Association."
      - name: est_societe_mission
        description: "Société à mission."
      - name: ca_dernier_exercice
        description: "CA du dernier exercice (k€)."
      - name: resultat_net_dernier
        description: "Résultat net du dernier exercice (k€)."
      - name: capital_social
        description: "Capital social."
      - name: convention_collective
        description: "Convention collective."
      - name: effectif_societe
        description: "Effectif (societe.com)."
      - name: total_offres
        description: "Nombre total d'offres publiées."

  - name: mart_salaires
    description: "Analyse des salaires par poste et employeur (hors alternance)."
    columns:
      - name: employer_name
        description: "Nom de l'employeur."
      - name: job_title
        description: "Intitulé du poste."
      - name: siren
        description: "SIREN de l'employeur."
      - name: categorie_entreprise
        description: "Catégorie d'entreprise."
      - name: nombre_offres
        description: "Nombre d'offres pour ce couple (employeur, poste)."
      - name: salaire_min_moyen
        description: "Salaire minimum moyen."
      - name: salaire_max_moyen
        description: "Salaire maximum moyen."

  - name: mart_finops_costs
    description: "Coûts GCP quotidiens agrégés par service et environnement (dataset finops_dev)."
    columns:
      - name: facturation_mois
        description: "Mois de facturation."
      - name: date_usage
        description: "Date d'usage."
      - name: service_nom
        description: "Service GCP (BigQuery, Cloud Run, etc.)."
      - name: cout_net
        description: "Coût net après crédits."

  - name: mart_pipeline_stats
    description: "Table de monitoring et qualite des donnees. Une ligne par table du pipeline (staging > intermediaire > mart) avec les metriques de volume, completude, fraicheur et statut."
    columns:
      - name: pipeline_stage
        description: "Etape du pipeline : Extraction, Enrichissement, Intermediaire, Mart."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Extraction', 'Enrichissement', 'Intermediaire', 'Mart']
      - name: source_system
        description: "Systeme source (France Travail, Adzuna, Geo, API Entreprise, n8n Societe, France Travail + Adzuna)."
      - name: table_name
        description: "Nom de la table BigQuery."
        tests:
          - not_null
          - unique
      - name: row_count
        description: "Nombre total de lignes dans la table."
      - name: column_count
        description: "Nombre de colonnes dans le schema."
      - name: key_columns
        description: "Liste des colonnes clefs monitorées pour le fill rate."
      - name: fill_rate_c1
        description: "Taux de remplissage colonne 1 (cle primaire ou premiere colonne cle, %)."
      - name: fill_rate_c2
        description: "Taux de remplissage colonne 2 (intitule/titre, %)."
      - name: fill_rate_c3
        description: "Taux de remplissage colonne 3 (description ou deuxieme colonne cle, %)."
      - name: fill_rate_c4
        description: "Taux de remplissage colonne 4 (nom employeur ou troisieme colonne cle, %)."
      - name: fill_rate_c5
        description: "Taux de remplissage colonne 5 (salaire/contrat ou quatrieme colonne cle, %)."
      - name: fill_rate_c6
        description: "Taux de remplissage colonne 6 (varie selon table, %)."
      - name: fill_rate_c7
        description: "Taux de remplissage colonne 7 (varie selon table, %)."
      - name: recency_date
        description: "Date de derniere donnee dans la table (MAX de la colonne temporelle)."
      - name: notes
        description: "Notes contextuelles sur la table et les transformations."
      - name: status
        description: "Statut de sante : OK (donnees recentes et non vides), STALE (pas de mise a jour >7j), VIDE (0 lignes), NON_RENSEIGNE (pas de date de reference)."
