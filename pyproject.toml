[project]
name = "data-market-pipeline"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "pytest>=8.3.5",
    "pytest-mock>=3.14.0",
    "ruff>=0.15.9",
]

[tool.ruff]
exclude = ["_old", "_developpements"]

[tool.pytest.ini_options]
norecursedirs = [
    "_old",
    ".venv",
    "00_infra",
    "01_shared",
    "03_transform",
    "n8n",
    ".opencode",
]
testpaths = ["tests"]

[tool.uv.workspace]
members = [
    "00_infra",
    "01_shared",
    "02_extract/france_travail",
    "02_extract/geo",
    "02_extract/adzuna",
]
